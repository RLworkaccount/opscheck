[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opscheck"
version = "0.1.0"
description = "Read-only infrastructure health checks (TLS certs, mail DNS) exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robbie Lyons" }]
dependencies = [
    "mcp>=2.3,<3",
    "dnspython>=2.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opscheck = "opscheck.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
